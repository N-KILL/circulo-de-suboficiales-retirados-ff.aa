[package]
name = "circulo-de-suboficiales"
version = "0.1.0"
description = "Sistema de Gestión del Círculo de Suboficiales Retirados"
authors = ["Ignacio Cardozo - NK"]
edition = "2021"

[lib]
name = "circulo_de_suboficiales_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-notification = { version = "2", features = ["windows7-compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "uuid", "tls-native-tls", "chrono", "rust_decimal"] }
tokio = { version = "1", features = ["net", "macros", "fs"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust-embed = "8"
mime_guess = "2"

# Logging & diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "registry", "chrono"] }
tracing-appender = "0.2"
sysinfo = "0.35"
zip = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
opt-level = "s"
overflow-checks = false
