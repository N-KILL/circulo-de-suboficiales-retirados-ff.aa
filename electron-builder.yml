appId: com.circulo-suboficiales.app
productName: Circulo de Suboficiales Retirados
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: .env
    to: .env
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/favicon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: public/favicon.png
  uninstallerIcon: public/favicon.png
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/favicon.png
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: public/favicon.png
