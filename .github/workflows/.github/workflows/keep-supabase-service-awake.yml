name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Call Supabase API
        run: |
          curl "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}"